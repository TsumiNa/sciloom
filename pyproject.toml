[project]
name = "SciLoom"
version = "0.3.10"
description = "SciLoom — programmable scientific automation from one semantic model."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sciloom"

# Workspace members share this lock file and carry the same [project].version.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mike = { git = "https://github.com/squidfunk/mike.git", rev = "2d4ad799442f4592db8ad53b179bfb33db8c69ac" }
sciloom-autosuite = { workspace = true }

[tool.pytest.ini_options]
# Integration tests import the independent contributor example from the checkout.
pythonpath = ["."]
# examples/ has no __init__.py; resolve its modules as namespace packages so the
# developer examples keep their single-dot relative imports under pytest.
consider_namespace_packages = true
markers = ["requires_corpus: reads optional, read-only AutoSuite evidence from the local corpus"]

[tool.ruff]
# Python only: never reformat code blocks inside Markdown documentation or evidence.
include = ["*.py", "*.pyi"]
exclude = [".venv", "venv", "__pycache__", ".git"]
# First-party roots, so sciloom_autosuite imports sort with sciloom imports.
src = [".", "src", "packages/sciloom-autosuite/src"]
line-length = 120
indent-width = 4

[tool.ruff.lint]
# PEP8
select = [
    "F", # Pyflakes
    "E", # pycodestyle
    "W", # pycodestyle
    "I", # isort: stdlib / third-party / local import groups
    "TID252", # flake8-tidy-imports: no parent-relative imports
]
ignore = [
    "F841", # unused-variable
    "E741", # ambiguous-variable-name
    "W505", # doc-line-too-long
    "E501", # line-too-long (handled by formatter)
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# Proposed frontend examples are syntax-checked design material, not runnable code.
"examples/proposed_frontend/*.py" = ["F821"]

[tool.ruff.lint.isort]
combine-as-imports = true
# Absolute sciloom.* imports and single-dot relative imports form one local group.
no-lines-before = ["local-folder"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.mypy]
# Production package and runnable examples share the public type contract.
# Colocated tests intentionally construct invalid runtime schemas and IR values.
files = [
    "src/sciloom",
    "packages/sciloom-autosuite/src/sciloom_autosuite",
    "examples/function_call.py",
    "examples/agitation.py",
    "examples/scale_values.py",
    "examples/non_zero_array_min.py",
    "examples/stir_rack.py",
    "examples/prepare_labels.py",
    "examples/quantity_conversion.py",
    "examples/numeric_operations.py",
    "examples/record_values.py",
    "examples/confirm_samples.py",
    "examples/timestamp_path.py",
    "examples/timed_agitation.py",
    "examples/read_reagent_table.py",
    "examples/tutorial",
    "examples/developer",
]
exclude = ["(_test|conftest)\\.py$"]
explicit_package_bases = true
mypy_path = ["$MYPY_CONFIG_FILE_DIR/src", "$MYPY_CONFIG_FILE_DIR/packages/sciloom-autosuite/src"]
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["sciloom.core.*", "sciloom_autosuite.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# IDEs may check excluded files explicitly. Mypy module patterns cannot match
# filename suffixes, so keep this list in sync when adding *_test.py modules.
