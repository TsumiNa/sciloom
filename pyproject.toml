[project]
name = "SciLoom"
version = "0.1.0"
description = "SciLoom — programmable scientific automation from one semantic model."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sciloom"

[tool.uv.sources]
mike = { git = "https://github.com/squidfunk/mike.git", rev = "2d4ad799442f4592db8ad53b179bfb33db8c69ac" }

[tool.pytest.ini_options]
# Integration tests import the independent contributor example from the checkout.
pythonpath = ["."]
# examples/ has no __init__.py; resolve its modules as namespace packages so the
# developer examples keep their single-dot relative imports under pytest.
consider_namespace_packages = true

[tool.ruff]
# Python only: never reformat code blocks inside Markdown documentation or evidence.
include = ["*.py", "*.pyi"]
exclude = [".venv", "venv", "__pycache__", ".git"]
line-length = 120
indent-width = 4

[tool.ruff.lint]
# PEP8
select = [
    "F", # Pyflakes
    "E", # pycodestyle
    "W", # pycodestyle
    "I", # isort: stdlib / third-party / local import groups
    "TID252", # flake8-tidy-imports: no parent-relative imports
]
ignore = [
    "F841", # unused-variable
    "E741", # ambiguous-variable-name
    "W505", # doc-line-too-long
    "E501", # line-too-long (handled by formatter)
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# Proposed frontend examples are syntax-checked design material, not runnable code.
"examples/proposed_frontend/*.py" = ["F821"]

[tool.ruff.lint.isort]
combine-as-imports = true
# Absolute sciloom.* imports and single-dot relative imports form one local group.
no-lines-before = ["local-folder"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.mypy]
# Production package and runnable examples share the public type contract.
# Colocated tests intentionally construct invalid runtime schemas and IR values.
files = [
    "src/sciloom",
    "examples/function_call.py",
    "examples/agitation.py",
    "examples/scale_values.py",
    "examples/non_zero_array_min.py",
    "examples/developer",
]
exclude = ["(_test|conftest)\\.py$"]
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["sciloom.core.*", "sciloom.contrib.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# IDEs may check excluded files explicitly. Mypy module patterns cannot match
# filename suffixes, so keep this list in sync when adding *_test.py modules.
[[tool.mypy.overrides]]
module = [
    "sciloom.units_test",
    "sciloom.devices.agitation_test",
    "sciloom.devices.declarations_test",
    "sciloom.dsl.device_operations_test",
    "sciloom.dsl.device_conditions_test",
    "sciloom.core.specialization_test",
    "sciloom.dsl.contribution_test",
    "sciloom.core.configuration_test",
    "sciloom.core.interpreter.device_state_test",
    "sciloom.contrib.autosuite.device_state_test",
    "sciloom.dsl.device_schema_test",
    "sciloom.core.devices_test",
    "sciloom.dsl.lowering_list_test",
    "sciloom.dsl.model_test",
    "sciloom.dsl.schema_test",
    "sciloom.dsl.schema_typing_test",
    "sciloom.dsl.statements_test",
    "sciloom.core.compiler_test",
    "sciloom.core.compiler_typing_test",
    "sciloom.core.interpreter.runtime_test",
    "sciloom.core.interpreter.runtime_list_test",
    "sciloom.core.interpreter.runtime_agitation_test",
    "sciloom.core.ir.codec_test",
    "sciloom.core.ir.codec_devices_test",
    "sciloom.core.ir.codec_list_test",
    "sciloom.core.ir.validation_test",
    "sciloom.contrib.autosuite.agitation_test",
    "sciloom.contrib.autosuite.codegen_test",
    "sciloom.contrib.autosuite.codegen_arrays_test",
    "sciloom.contrib.autosuite.codegen_agitation_test",
    "sciloom.contrib.autosuite.target_test",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
docs = [
    "griffelib>=2.3.0",
    "mike",
    "mkdocstrings-python>=2.0.8",
    "zensical>=0.0.61",
]
