[project]
name = "SciLoom"
version = "0.1.0"
description = "SciLoom — programmable scientific automation from one semantic model."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sciloom"

[tool.ruff]
exclude = [".venv", "venv", "__pycache__", ".git"]
line-length = 120
indent-width = 4

[tool.ruff.lint]
# PEP8
select = [
    "F", # Pyflakes
    "E", # pycodestyle
    "W", # pycodestyle
]
ignore = [
    "F841", # unused-variable
    "E741", # ambiguous-variable-name
    "W505", # doc-line-too-long
    "E501", # line-too-long (handled by formatter)
]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint.mccabe]
# C901
max-complexity = 10

[tool.mypy]
# Production package and runnable examples share the public type contract.
# Colocated tests intentionally construct invalid runtime schemas and IR values.
files = ["src/sciloom", "examples/function_call.py", "examples/agitation.py", "examples/scale_values.py", "examples/non_zero_array_min.py", "examples/developer"]
exclude = ["(_test|conftest)\\.py$"]
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["sciloom.core.*", "sciloom.contrib.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]
