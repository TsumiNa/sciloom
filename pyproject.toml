disallow_incomplete_defs = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "sciloom-autosuite",
]
docs = [
    "griffelib>=2.3.0",
    "mike",
    "mkdocstrings-python>=2.0.8",
    "zensical>=0.0.61",
]
