site_name: SciLoom
site_description: Programmable scientific automation from one semantic model.
site_url: !ENV [SCILOOM_DOCS_SITE_URL, 'https://tsumina.github.io/sciloom/']
docs_dir: docs
site_dir: .build/site
theme:
  name: zensical
  custom_dir: theme
  language: en
  font: false
  logo: assets/brand/svg/sciloom-mark-light.svg
  favicon: assets/brand/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: lucide/moon
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: lucide/sun
        name: Switch to light mode
