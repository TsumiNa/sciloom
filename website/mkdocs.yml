plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../src, ../packages/sciloom-autosuite/src]
          options:
            allow_inspection: false
            docstring_style: google
            show_source: false
            show_bases: true
            show_if_no_docstring: true
            filters: ["!^_"]
            show_root_heading: true
            show_root_full_path: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            show_attribute_values: false
            merge_init_into_class: true
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [..]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  invalid_links: true
  invalid_link_anchors: true
extra_css:
  - assets/stylesheets/brand.css
extra:
  version:
    provider: mike
  source_version: !ENV [SCILOOM_DOCS_VERSION, local]
  source_ref: !ENV [SCILOOM_DOCS_REF, HEAD]
  source_commit: !ENV [SCILOOM_DOCS_COMMIT, unknown]
  package_version: !ENV [SCILOOM_DOCS_PACKAGE_VERSION, unknown]
