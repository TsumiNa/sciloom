site_name: SciLoom
site_description: Programmable scientific automation from one semantic model.
site_url: !ENV [SCILOOM_DOCS_SITE_URL, 'https://tsumina.github.io/sciloom/']
docs_dir: docs
site_dir: .build/site
theme:
  name: zensical
  custom_dir: theme
  language: en
  font: false
  logo: assets/brand/svg/sciloom-mark-light.svg
  favicon: assets/brand/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: lucide/moon
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: lucide/sun
        name: Switch to light mode
nav:
  - Introduction:
      - Welcome: index.md
      - Getting started: introduction/getting-started.md
      - Current capabilities: introduction/status.md
      - Glossary: introduction/glossary.md
  - User Guide:
      - Overview: user-guide/index.md
      - Tutorial:
          - Stir a rack of samples: user-guide/tutorial/index.md
          - 1. Your first Function: user-guide/tutorial/first-function.md
          - 2. Inputs, outputs and speeds: user-guide/tutorial/inputs-and-units.md
          - 3. Lists and loops: user-guide/tutorial/lists-and-loops.md
          - 4. Stirring with an Agitator: user-guide/tutorial/agitator.md
          - 5. Bind and compile: user-guide/tutorial/compile.md
      - Advanced:
          - Composition and shared devices: user-guide/advanced/composition.md
          - Host-time specialization: user-guide/advanced/specialization.md
          - Device-dependent branches: user-guide/advanced/device-branches.md
          - AutoSuite rules: user-guide/advanced/autosuite.md
      - FAQ: user-guide/faq.md
      - Troubleshooting: user-guide/troubleshooting.md
      - Reference:
          - Declarations: user-guide/reference/declarations.md
          - Runtime language: user-guide/reference/runtime-language.md
          - Devices and targets: user-guide/reference/devices-and-targets.md
  - Developer Guide:
      - Overview: developer/index.md
      - Tutorial:
          - Add a device: developer/add-a-device.md
          - Add a target: developer/add-a-target.md
          - Reject a program: developer/reject-a-program.md
      - Reference:
          - Architecture and ownership: developer/reference/architecture.md
          - Semantic IR and JSON v4: developer/reference/ir.md
          - Compilation pipeline: developer/reference/pipeline.md
          - Target contract: developer/reference/target-contract.md
          - Device contracts: developer/reference/device-contracts.md
          - Reference execution: developer/reference/interpreter.md
          - Verification: developer/reference/verification.md
      - Project:
          - Typing and tests: developer/typing-and-tests.md
          - Building documentation: developer/documentation.md
          - Versioned publication: developer/publication.md
          - Brand assets: developer/brand.md
  - Examples:
      - Overview: examples/index.md
      - Function calls: examples/function-call.md
      - Agitation: examples/agitation.md
      - Scale values: examples/scale-values.md
      - Non Zero Array Min: examples/non-zero-array-min.md
      - Stir a rack of samples: examples/stir-rack.md
      - Agitation IR: examples/agitation-ir.md
      - List IR: examples/list-ir.md
      - Independent device: examples/demo-device.md
      - Portable agitation: examples/portable-agitation.md
  - API Reference:
      - Overview: api/index.md
      - Author API: api/author.md
      - Units: api/units.md
      - Compile-time queries: api/comptime.md
      - AutoSuite: api/autosuite.md
      - Device declarations: api/devices.md
      - IR values: api/ir-values.md
      - IR programs and flow: api/ir-flow.md
      - IR devices and conditions: api/ir-devices.md
      - IR validation and JSON: api/ir-json.md
      - Compiler and specialization: api/compiler.md
      - Interpreter: api/interpreter.md
      - Diagnostics: api/diagnostics.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../src, ../packages/sciloom-autosuite/src]
          options:
            allow_inspection: false
            docstring_style: google
            show_source: false
            show_bases: true
            show_if_no_docstring: true
            filters: ["!^_"]
            show_root_heading: true
            show_root_full_path: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            show_attribute_values: false
            merge_init_into_class: true
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [..]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  invalid_links: true
  invalid_link_anchors: true
extra_css:
  - assets/stylesheets/brand.css
extra:
  version:
    provider: mike
  source_version: !ENV [SCILOOM_DOCS_VERSION, local]
  source_ref: !ENV [SCILOOM_DOCS_REF, HEAD]
  source_commit: !ENV [SCILOOM_DOCS_COMMIT, unknown]
  package_version: !ENV [SCILOOM_DOCS_PACKAGE_VERSION, unknown]
