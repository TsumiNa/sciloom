site_name: SciLoom
site_description: Programmable scientific automation from one semantic model.
site_url: !ENV [SCILOOM_DOCS_SITE_URL, 'https://tsumina.github.io/sciloom/']
docs_dir: docs
site_dir: .build/site
theme:
  name: zensical
  custom_dir: theme
  language: en
  font: false
  logo: assets/brand/svg/sciloom-mark-light.svg
  favicon: assets/brand/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: lucide/moon
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: lucide/sun
        name: Switch to light mode
nav:
  - Introduction:
      - Welcome: index.md
      - Getting started: introduction/getting-started.md
      - Current capabilities: introduction/status.md
  - User Guide:
      - Functions and fields: user-guide/functions.md
      - Values, units and lists: user-guide/values.md
      - Runtime control flow: user-guide/control-flow.md
      - Composition: user-guide/composition.md
      - Devices: user-guide/devices.md
      - Compilation: user-guide/compilation.md
  - Developer Guide:
      - Architecture: developer/architecture.md
      - 'Tutorial: add a device': developer/add-a-device.md
      - 'Tutorial: add a target': developer/add-a-target.md
      - Semantic IR and JSON: developer/ir.md
      - Compiler and specialization: developer/compiler.md
      - Reference execution: developer/interpreter.md
      - Device and target contributions: developer/contributions.md
      - Typing and tests: developer/typing-and-tests.md
      - Building documentation: developer/documentation.md
      - Versioned publication: developer/publication.md
      - Brand assets: developer/brand.md
  - Examples:
      - Overview: examples/index.md
      - Function calls: examples/function-call.md
      - Agitation: examples/agitation.md
      - Scale values: examples/scale-values.md
      - Non Zero Array Min: examples/non-zero-array-min.md
      - Agitation IR: examples/agitation-ir.md
      - List IR: examples/list-ir.md
      - Independent device: examples/demo-device.md
      - Portable agitation: examples/portable-agitation.md
  - API Reference:
      - Overview: api/index.md
      - Author API: api/author.md
      - Units: api/units.md
      - Compile-time queries: api/comptime.md
      - AutoSuite: api/autosuite.md
      - Device declarations: api/devices.md
      - IR values: api/ir-values.md
      - IR programs and flow: api/ir-flow.md
      - IR devices and conditions: api/ir-devices.md
      - IR validation and JSON: api/ir-json.md
      - Compiler and specialization: api/compiler.md
      - Interpreter: api/interpreter.md
      - Diagnostics: api/diagnostics.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../src]
          options:
            allow_inspection: false
            docstring_style: google
            show_source: false
            show_bases: true
            show_if_no_docstring: true
            filters: ["!^_"]
            show_root_heading: true
            show_root_full_path: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            show_attribute_values: false
            merge_init_into_class: true
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [..]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  invalid_links: true
  invalid_link_anchors: true
extra_css:
  - assets/stylesheets/brand.css
extra:
  version:
    provider: mike
  source_version: !ENV [SCILOOM_DOCS_VERSION, local]
  source_ref: !ENV [SCILOOM_DOCS_REF, HEAD]
  source_commit: !ENV [SCILOOM_DOCS_COMMIT, unknown]
  package_version: !ENV [SCILOOM_DOCS_PACKAGE_VERSION, unknown]
