name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    env:
      SCILOOM_DOCS_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.10"
          python-version: "3.14"
      - run: uv sync --locked --group docs
      - run: uv run --group docs python website/tools/site.py build --strict
      - run: uv run --group docs pytest website/tools
      - run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-${{ github.event.pull_request.head.sha || github.sha }}
          path: website/.build/site
          retention-days: 14
          if-no-files-found: error
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest src/sciloom packages/sciloom-autosuite/src examples
      - run: uv run pytest autosuite/tools
      - run: uv run python autosuite/tools/smoke_test.py
      - run: uv run python autosuite/recipe/validate_recipe.py autosuite/recipe/input_0908.csv
      - run: uv run python -m compileall -q examples/proposed_frontend
      - run: uv run python examples/function_call.py
      - run: uv run python examples/agitation.py
      - run: uv run python examples/scale_values.py
      - run: uv run python examples/prepare_labels.py
      - run: uv run python examples/quantity_conversion.py
      - run: uv run python examples/numeric_operations.py
      - run: uv run python examples/record_values.py
      - run: uv run python examples/confirm_samples.py
      - run: uv run python examples/identify_sample.py
      - run: uv run python examples/capture_barcode.py
      - run: uv run python examples/timestamp_path.py
      - run: uv run python examples/timed_agitation.py
      - run: uv run python examples/read_reagent_table.py
      - run: uv run python examples/stir_selected_location.py
      - run: uv run python examples/label_sample_log.py
      - run: uv run python examples/aspiration_chunk.py
      - run: uv run python -m examples.developer.runtime_workflows_ir
      - run: uv run python -m examples.developer.aspiration_chunk_ir
      - run: uv run python -m examples.developer.csv_read_ir
      - run: uv run python examples/append_sample_log.py
      - run: uv run python -m examples.developer.csv_append_ir
      - run: uv run python examples/resolve_locations.py
      - run: uv run python -m examples.developer.zone_ir
      - run: uv run python examples/visit_locations.py
      - run: uv run python examples/label_wells.py
      - run: uv run python -m examples.developer.well_properties_ir
      - run: uv run python -m examples.developer.device_locations_ir
      - run: uv run python -m examples.developer.zone_traversal_ir
      - run: uv run python examples/non_zero_array_min.py
      - run: uv run python examples/stir_rack.py
      - run: uv run python examples/tutorial/start_shaker.py
      - run: uv run python examples/tutorial/control_shaker.py
      - run: uv run python examples/tutorial/choose_stirring_speed.py
      - run: uv run python examples/tutorial/stir_sample_rack.py
      - run: uv run python -m examples.developer.agitation_ir
      - run: uv run python -m examples.developer.list_ir
      - run: uv run python -m examples.developer.reference_environment
      - run: uv run python -m examples.developer.deployment_review
      - run: uv run python -m examples.developer.logging_ir
      - run: uv run python -m examples.developer.confirmation_ir
      - run: uv run python -m examples.developer.dialogs_ir
      - run: uv run python -m examples.developer.barcode_ir
      - run: uv run python -m examples.developer.wall_time_ir
      - run: uv run python -m examples.developer.timing_ir
      - run: uv run python -m examples.developer.demo_device
      - run: uv run python -m examples.developer.lifecycle_commands
      - run: uv run python examples/temperature_values.py
      - run: uv run python -m examples.developer.temperature_ir
      - run: uv run python examples/warm_sample.py
      - run: uv run python -m examples.developer.warm_sample_ir
      - run: uv run python examples/transfer_sample.py
      - run: uv run python -m examples.developer.transfer_sample_ir
      - run: uv run python examples/transfer_settings.py
      - run: uv run python -m examples.developer.transfer_values_ir
      - run: uv run python -m examples.developer.location_command_ir
      - run: uv run python -m examples.developer.portable_agitation
      - run: git diff --exit-code
