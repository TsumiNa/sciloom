name: Publish documentation

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

# Reconcile all checked refs on each run: concurrency queues may replace pending
# events, but cannot lose eligible release tags. Never cancel a running publisher.
concurrency:
  group: documentation-publication
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.10"
          python-version: "3.14"
      - run: uv sync --locked --group docs
      - name: Reconcile checked main and release snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: uv run --group docs python docs/tools/publication.py --repository "$SOURCE_REPOSITORY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-history
          path: .build/publication/history.bundle
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .build/publication/site

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: documentation-history
          path: .build/publication
      - name: Preserve generated-only version history
        run: |
          git fetch .build/publication/history.bundle gh-pages:refs/heads/gh-pages
          git push origin gh-pages:gh-pages
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy checked static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
